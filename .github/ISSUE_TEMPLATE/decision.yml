name: Decision
description: An open question the task description does not answer (DEC-n). The outcome is recorded in an ADR or the README
title: "[DEC-n] "
labels: ["decision"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: Who should be able to do what, concretely (e.g. "Merchants can add a tag to an order from the order list")
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Why this is needed now. Constraints from the users or from how things work today
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Where it hurts today, what should change, and which current behaviour must be kept
      value: |
        - Today:
        - Change:
        - Keep:
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What needs to be decided, and why the task description alone does not settle it
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Findings
      description: Evidence such as links to official documentation
  - type: dropdown
    id: record
    attributes:
      label: Where the outcome is recorded
      options:
        - ADR (docs/adr/)
        - docs/interpretation.md
    validations:
      required: true
