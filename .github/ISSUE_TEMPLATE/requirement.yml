name: Requirement
description: One requirement from the task description (BE-n / SUB-n)
title: "[BE-n] "
labels: ["requirement"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: Who should be able to do what, concretely (e.g. "Merchants can add a tag to an order from the order list")
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Why this is needed now. Constraints from the users or from how things work today
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Where it hurts today, what should change, and which current behaviour must be kept
      value: |
        - Today:
        - Change:
        - Keep:
    validations:
      required: true
  - type: input
    id: req_id
    attributes:
      label: Requirement ID
      description: ID in docs/requirements.md
      placeholder: BE-3
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Task description
      description: Quote the relevant part of the task description verbatim
      render: markdown
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Interpretation
      description: How the requirement is read, and related ADRs / DECs
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist. Close the issue when all items are met
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test list
      description: |
        Written before implementation. Work through it top to bottom with Red → Green → Refactor.
        Naming: BE-{n} {Feature} : {spec}. {test case}
      value: |
        - [ ] `BE-n Feature : 1. `
    validations:
      required: true
