name: Chore
description: Work that is neither a requirement nor a decision (setup, tooling, etc.)
title: "[CHORE] "
labels: ["chore"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: Who should be able to do what, concretely (e.g. "Merchants can add a tag to an order from the order list")
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Why this is needed now. Constraints from the users or from how things work today
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Where it hurts today, what should change, and which current behaviour must be kept
      value: |
        - Today:
        - Change:
        - Keep:
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
    validations:
      required: true
