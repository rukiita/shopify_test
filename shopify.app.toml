# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4eb78224a7cd4cbe829b48c5c76ec6c5"
name = "order-tags-app"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,write_orders"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders"
  topics = ["orders/create", "orders/updated"]

[events]
api_version = "2026-10"

  [[events.subscription]]
  handle = "product-price-change"
  topic = "Product"
  actions = [ "update" ]
  triggers = [ "product.variants.price", "product.variants.compareAtPrice" ]
  uri = "/webhooks/products/update"
  query = """
  query product_variant_price_change($productId: ID!, $variantsId: ID!) {
    product(id: $productId) {
      id
      title
      status
    }
    productVariant(id: $variantsId) {
      id
      title
      price
      compareAtPrice
    }
  }
  """
  query_filter = "product.status:'ACTIVE'"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
